name: thaishield_ai
description: "ThaiShield AI - Travel Safety Companion"
publish_to: 'none'

version: 1.1.0+24
environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  firebase_core: ^3.13.1
  cloud_firestore: ^5.6.6
  google_maps_flutter: ^2.10.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.3.0
  http: ^1.6.0
  url_launcher: ^6.3.2
  geolocator: ^14.0.3
  geocoding: ^4.0.0
  image_picker: ^1.2.2
  google_mlkit_text_recognition: ^0.15.1
  record: ^5.2.0
  path_provider: ^2.1.5
  flutter_tts: ^4.1.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device tests (integration_test/). Added 2026-08-23: the project had
  # thorough manual QA checklists and nothing that ran itself, so every feature
  # change cost a full hands-on pass and regressions could only be caught by a
  # human remembering to look. See DEV_PROCESS.md at the workspace root.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Both are already in the tree via url_launcher; declared here so the paywall
  # widget test can swap in a fake launcher and prove the store-required Terms
  # and Privacy links actually open something. Without that fake the only thing
  # a test can check is that two dictionary entries are non-empty, which passes
  # with both links deleted from the screen.
  plugin_platform_interface: ^2.1.8
  url_launcher_platform_interface: ^2.3.2
  flutter_launcher_icons: ^0.14.3

# record 5.2.1 pins record_linux to '>=0.5.0 <1.0.0', so pub resolves 0.7.2 —
# which predates `startStream` on RecordMethodChannelPlatformInterface and so
# fails Dart compilation on EVERY target, Android included, because the kernel
# compile walks the whole package graph:
#   record_linux.dart:12:7: Error: The non-abstract class 'RecordLinux' is
#   missing implementations for RecordMethodChannelPlatformInterface.startStream
# record_linux 1.3.1 implements it and targets the same ^1.5.0 interface line as
# record_android/record_web, so only record's own upper bound stands in the way
# — hence the override. Linux is not a build target here (§1 of CLAUDE.md); this
# package is compiled only because it sits in the graph. Drop the override once
# `record` widens that constraint.
dependency_overrides:
  record_linux: 1.3.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.jpg"
  adaptive_icon_background: "#0A1810"
  adaptive_icon_foreground: "assets/images/logo.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
